# infrastructure/config/model_config.yaml
# LightFace-Net Architecture Hyperparameters
# All architecture parameters are defined here.
# Never hard-code these values in Python source files.

model:
  name: "LightFace-Net"
  version: "1.0.0"

backbone:
  stage_configs:
    - {in_channels: 32,  out_channels: 16,  num_blocks: 1, stride: 1, expand_ratio: 1}
    - {in_channels: 16,  out_channels: 24,  num_blocks: 2, stride: 2, expand_ratio: 6}
    - {in_channels: 24,  out_channels: 32,  num_blocks: 3, stride: 2, expand_ratio: 6}  # P3
    - {in_channels: 32,  out_channels: 64,  num_blocks: 4, stride: 2, expand_ratio: 6}
    - {in_channels: 64,  out_channels: 96,  num_blocks: 3, stride: 1, expand_ratio: 6}
    - {in_channels: 96,  out_channels: 160, num_blocks: 3, stride: 2, expand_ratio: 6}  # P4
    - {in_channels: 160, out_channels: 320, num_blocks: 1, stride: 1, expand_ratio: 6}  # P5

afpn:
  c3_channels: 32
  c4_channels: 160
  c5_channels: 320
  out_channels: 256

head:
  in_channels: 256
  num_anchors: 4        # 2 sizes × 2 aspect ratios per location
  num_convs: 4

anchors:
  strides: [8, 16, 32]
  base_sizes: [[16, 32], [64, 128], [256, 512]]
  aspect_ratios: [1.0, 1.5]

nms:
  score_threshold: 0.3
  iou_threshold: 0.45
  max_detections: 300

pipeline:
  input_size: [640, 480]
  device: "cpu"
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
