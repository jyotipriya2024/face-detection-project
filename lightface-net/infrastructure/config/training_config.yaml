# infrastructure/config/training_config.yaml
# LightFace-Net Training Hyperparameters

training:
  epochs: 120
  batch_size: 32
  grad_clip: 10.0
  accum_steps: 1
  amp: true
  checkpoint_dir: "models/checkpoints"
  save_every: 10
  log_every: 50
  device: "cuda"             # Override to "cpu" if no GPU

optimizer:
  lr: 0.001
  weight_decay: 0.0005
  betas: [0.9, 0.999]
  eps: 1.0e-8
  warmup_epochs: 5
  total_epochs: 120
  warmup_start_lr: 1.0e-6
  eta_min: 1.0e-6

loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  lambda_reg: 2.0

data:
  wider_face_root: "data/wider_face"
  fddb_root: null
  batch_size: 32
  num_workers: 4
  val_split: 0.1
  pin_memory: true
  prefetch_factor: 2

  augmentation:
    train: true
    spatial:
      target_size: [640, 480]
      flip_prob: 0.5
      crop_scale: [0.3, 1.0]
      crop_ratio: [0.5, 2.0]
      min_face_overlap: 0.5
    color:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
